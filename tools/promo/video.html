let done=new Set();window.ready=new Promise(r=>document.querySelector('iframe').onload=r);function smooth(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);}function inner(code){return document.querySelector('iframe').contentWindow.eval(code);}function action(key,at,t,fn){if(t>=at&&!done.has(key)){done.add(key);return fn();}}function scrollToPanel(t,start,id){const w=document.querySelector('iframe').contentWindow,el=w.document.getElementById(id),y=el.getBoundingClientRect().top+w.scrollY-70;w.scrollTo(0,Math.max(0,y)*smooth((t-start)/.65));}function input(id,value){const w=document.querySelector('iframe').contentWindow,e=w.document.getElementById(id);if(e.value!==value){e.value=value;e.dispatchEvent(new w.Event('input',{bubbles:true}));}}function click(id){document.querySelector('iframe').contentDocument.getElementById(id).click();}
